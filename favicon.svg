<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MH Works">
	<defs>
		<linearGradient id="mhCyan" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#7df0ff" />
			<stop offset="1" stop-color="#22d3ee" />
		</linearGradient>
		<linearGradient id="mhViolet" x1="1" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#a855f7" />
			<stop offset="1" stop-color="#e935e0" />
		</linearGradient>
		<!-- Top half of the overlap, where the left link comes back over the
		     right one. That re-crossing is what makes the pair read as linked
		     rather than merely overlapping. -->
		<clipPath id="mhOver">
			<rect x="15" y="0" width="28" height="32" />
		</clipPath>
	</defs>

	<rect width="64" height="64" rx="14" fill="#0d1117" />

	<g fill="none" stroke-width="8">
		<rect x="8" y="20" width="32" height="24" rx="12" stroke="url(#mhCyan)" />

		<!-- Casing in the tile colour, so the right link reads as passing in front -->
		<rect x="24" y="20" width="32" height="24" rx="12" stroke="#0d1117" stroke-width="14" />
		<rect x="24" y="20" width="32" height="24" rx="12" stroke="url(#mhViolet)" />

		<g clip-path="url(#mhOver)">
			<rect x="8" y="20" width="32" height="24" rx="12" stroke="#0d1117" stroke-width="14" />
			<rect x="8" y="20" width="32" height="24" rx="12" stroke="url(#mhCyan)" />
		</g>
	</g>
</svg>
